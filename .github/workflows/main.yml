name: Flutter CI

# يشتغل سير العمل تلقائياً عند أي Push على فرع main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. إعداد بيئة جافا (مهمة لأندرويد)
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. إعداد وتثبيت فلاتر
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. تحميل الحزم والمكتبات الخاصة بمشروعك
    - name: Install dependencies
      run: flutter pub get

    # 5. تحليل الكود للتأكد من خلوه من الأخطاء القياسية
    - name: Analyze project source
      run: flutter analyze

    # 6. تشغيل الاختبارات (إذا كانت موجودة)
    - name: Run tests
      run: flutter test

